<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stego Run</title>
<style>
  html, body {
    height: 100%; margin: 0; overflow: hidden; background: #1d1b22; overscroll-behavior: none;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game" width="800" height="240" aria-label="Endless runner game"></canvas>

<script>
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const PX = 3;
let state;
let W = 800, H = 240, GROUND = 200, speedScale = 1;
const isTouch = () => matchMedia("(pointer: coarse)").matches;

// Wide screens keep an 800-wide world. Portrait screens get a narrower world so the
// characters stay big, with a thumb area under the ground.
function fit() {
  const iw = innerWidth, ih = innerHeight;
  const nextW = iw / ih >= 1.2 ? 800 : Math.round(Math.max(480, Math.min(800, iw * 1.2)));
  const nextH = Math.round(Math.max(240, Math.min(1200, nextW * ih / iw)));
  const nextGround = nextH - (nextH > 500 ? Math.round(nextH * 0.28) : 40);
  if (state) {
    for (const o of state.obstacles) o.y += nextGround - GROUND;
    if (nextW !== W && state.mode === "play") state.mode = "pause"; // rotating the phone shouldn't kill you
  }
  W = nextW; H = nextH; GROUND = nextGround;
  speedScale = 0.5 + 0.5 * W / 800;
  const scale = Math.min(iw / W, ih / H);
  const res = Math.min(4, Math.ceil(scale * (devicePixelRatio || 1)));
  canvas.width = W * res; canvas.height = H * res;
  canvas.dataset.res = res;
  canvas.style.width = W * scale + "px";
  canvas.style.height = H * scale + "px";
}

let triedFullscreen = false;
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}
function autoFullscreen() {
  if (triedFullscreen) return; // only once, so Esc stays out of full screen
  triedFullscreen = true;
  if (!document.fullscreenElement) toggleFullscreen();
}

const COLORS = {
  g: "#4f9d69", l: "#a8d5a2", p: "#e8743b", e: "#17151c", w: "#ffffff",
  r: "#8a7f8d", s: "#b5abb5", f: "#2f7d5b", h: "#6fbf8b",
  b: "#c44569", y: "#f7b731"
};

function sprite(rows) {
  const c = document.createElement("canvas");
  c.width = Math.max(...rows.map(r => r.length)) * PX;
  c.height = rows.length * PX;
  const x = c.getContext("2d");
  rows.forEach((row, j) => [...row].forEach((ch, i) => {
    if (COLORS[ch]) { x.fillStyle = COLORS[ch]; x.fillRect(i * PX, j * PX, PX, PX); }
  }));
  return c;
}

const stegoTop = [
  ".......p...p...p.....",
  "......ppp.ppp.ppp....",
  ".....ggggggggggggg...",
  "....ggggggggggggggg.gg",
  "...gggggggggggggggggwe",
  "..gggggggggggggggggggg",
  ".ggglllllllllllllll...",
  "gg..llllllllllllll...."
];
const SPR = {
  run1: sprite([...stegoTop, "....gg.........gg.....", "....gg.........gg.....", "................gg...."]),
  run2: sprite([...stegoTop, ".....gg.......gg......", ".....gg.......gg......", "....gg................"]),
  duck1: sprite([
    "........p..p..p.......",
    ".....ggggggggggggg.gg.",
    "..ggggggggggggggggggwe",
    "ggg.llllllllllllllgggg",
    "....gg.........gg.....",
    "....gg..........gg...."
  ]),
  duck2: sprite([
    "........p..p..p.......",
    ".....ggggggggggggg.gg.",
    "..ggggggggggggggggggwe",
    "ggg.llllllllllllllgggg",
    ".....gg.......gg......",
    "....gg........gg......"
  ]),
  rockS: sprite([
    "...ssss...",
    "..srrrrs..",
    ".srrrrrrr.",
    ".rrrrrrrr.",
    "rrrrrrrrrr",
    "rrrrrrrrrr"
  ]),
  rockL: sprite([
    ".....ssss.....",
    "....srrrrr....",
    "...srrrrrrr...",
    "...rrrrrrrr...",
    "..srrrrrrrrr..",
    "..rrrrrrrrrrr.",
    ".srrrrrrrrrrr.",
    ".rrrrrrrrrrrr.",
    "rrrrrrrrrrrrrr",
    "rrrrrrrrrrrrrr"
  ]),
  fern: sprite([
    "h....f....h",
    "hf...f...fh",
    ".hf..f..fh.",
    "..hf.f.fh..",
    "h..hfffh..h",
    "hf..fff..fh",
    ".hf.fff.fh.",
    "..hffffffh.",
    "....fff....",
    "....fff....",
    "....fff....",
    "....fff...."
  ]),
  bird1: sprite([
    "....bb.......",
    "....bbb......",
    "...bbbbb.....",
    "..bbbbbbbbby.",
    "bbbbbbbbbbe..",
    "....bbbbbb...",
  ]),
  bird2: sprite([
    ".............",
    ".............",
    "...bbbbbbbby.",
    "bbbbbbbbbbe..",
    "...bbbbbb....",
    "...bbbb......",
    "....bb.......",
    "....b........"
  ])
};

const JUMP_V = -640, GRAVITY = 1900, FAST_FALL = 4200;
const START_SPEED = 300, MAX_SPEED = 720, ACCEL = 6;

const store = {
  get() { try { return +localStorage.getItem("stego-hi") || 0; } catch { return 0; } },
  set(v) { try { localStorage.setItem("stego-hi", v); } catch {} }
};

let hi = store.get(), soundOn = true, audio;

function reset(mode) {
  state = {
    mode, speed: START_SPEED, score: 0, dist: 0, nextSpawn: 0.6, obstacles: [],
    t: 0, flash: 0, night: 0, nightTarget: 0,
    clouds: Array.from({ length: 4 }, (_, i) => ({ x: i * 220 + 60, y: 40 + Math.random() * H * 0.3 })),
    specks: Array.from({ length: 40 }, () => ({ x: Math.random() * 800, y: 8 + Math.random() * 28 })),
    stars: Array.from({ length: 30 }, () => ({ x: Math.random() * 800, y: Math.random() * 500 })),
    player: { y: 0, vy: 0, ducking: false, jumpBuffer: 0, holding: false, fastFall: false }
  };
}

function beep(freq, dur, type = "square", vol = 0.04) {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  } catch {}
}

function pressJump() {
  autoFullscreen();
  if (state.mode === "over") {
    if (state.t <= 0.2) return; // brief guard so a mistimed press doesn't skip the score
    reset("play");
  } else {
    state.mode = "play";
  }
  state.player.jumpBuffer = 0.13; // a press just before landing still counts
  state.player.holding = true;
}

function releaseJump() {
  const p = state.player;
  p.holding = false;
  if (p.vy < -480) p.vy = -480; // a quick tap still clears every obstacle
}

addEventListener("keydown", e => {
  const k = e.code;
  const jumpKey = k === "Space" || e.key === " " || k === "ArrowUp";
  if (jumpKey || k === "ArrowDown") e.preventDefault();
  if (e.repeat) return;
  if (jumpKey) pressJump();
  if (k === "ArrowDown") {
    state.player.ducking = true;
    if (state.player.y < 0) state.player.fastFall = true;
  }
  if (k === "KeyP") {
    if (state.mode === "play") state.mode = "pause";
    else if (state.mode === "pause") state.mode = "play";
  }
  if (k === "KeyM") soundOn = !soundOn;
  if (k === "KeyF") { triedFullscreen = true; toggleFullscreen(); }
});
addEventListener("keyup", e => {
  if (e.code === "Space" || e.key === " " || e.code === "ArrowUp") releaseJump();
  if (e.code === "ArrowDown") { state.player.ducking = false; state.player.fastFall = false; }
});
// Touch: right side jumps, holding the left side ducks. Several fingers can be down at once.
const duckFingers = new Set();
canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const leftSide = e.clientX - r.left < r.width / 2;
  if (e.pointerType === "touch" && leftSide && state.mode === "play") {
    duckFingers.add(e.pointerId);
    state.player.ducking = true;
    if (state.player.y < 0) state.player.fastFall = true;
  } else {
    pressJump();
  }
});
function pointerEnd(e) {
  if (duckFingers.delete(e.pointerId)) {
    if (!duckFingers.size) { state.player.ducking = false; state.player.fastFall = false; }
  } else {
    releaseJump();
  }
}
addEventListener("pointerup", pointerEnd);
addEventListener("pointercancel", pointerEnd);
addEventListener("contextmenu", e => e.preventDefault());
addEventListener("blur", () => {
  if (state.mode === "play") state.mode = "pause";
  state.player.holding = false;
  state.player.ducking = false;
  state.player.fastFall = false;
});

function spawn() {
  const birdsAllowed = state.score > 200;
  const roll = Math.random();
  let o;
  if (birdsAllowed && roll < 0.22) {
    const y = [GROUND - 36, GROUND - 70, GROUND - 130][Math.floor(Math.random() * 3)];
    o = { kind: "bird", x: W + 20, y, w: 39, h: 24, extra: 40 };
  } else {
    const names = state.score > 80 ? ["rockS", "rockL", "fern", "double"] : ["rockS", "fern"];
    const name = names[Math.floor(Math.random() * names.length)];
    if (name === "double") {
      const a = SPR.rockS;
      state.obstacles.push({ kind: "rockS", x: W + 20 + a.width, y: GROUND - a.height, w: a.width, h: a.height });
      o = { kind: "rockS", x: W + 20, y: GROUND - a.height, w: a.width, h: a.height };
    } else {
      const s = SPR[name];
      o = { kind: name, x: W + 20, y: GROUND - s.height, w: s.width, h: s.height };
    }
  }
  state.obstacles.push(o);
  const minGap = 0.62 + 130 / state.speed;
  state.nextSpawn = minGap + Math.random() * 0.8;
}

function playerBox() {
  const p = state.player, grounded = p.y >= 0;
  if (p.ducking && grounded) {
    const s = SPR.duck1;
    return { x: 54, y: GROUND - s.height + 4, w: s.width - 10, h: s.height - 6 };
  }
  const s = SPR.run1;
  return { x: 58, y: GROUND - s.height + p.y + 8, w: s.width - 22, h: s.height - 12 };
}

function hits(a, o) {
  const i = 4;
  return a.x < o.x + o.w - i && a.x + a.w > o.x + i && a.y < o.y + o.h - i && a.y + a.h > o.y + i;
}

function update(dt) {
  state.t += dt;
  if (state.mode !== "play") return;
  const p = state.player;

  state.speed = Math.min(MAX_SPEED, state.speed + ACCEL * dt);
  state.dist += state.speed * dt;
  const prev = Math.floor(state.score / 100);
  state.score = state.dist / 40;
  if (Math.floor(state.score / 100) > prev) { state.flash = 1; beep(880, 0.12); }
  state.nightTarget = Math.floor(state.score / 600) % 2;
  state.night += (state.nightTarget - state.night) * Math.min(1, dt * 1.5);
  state.flash = Math.max(0, state.flash - dt);

  if ((p.jumpBuffer > 0 || p.holding) && p.y >= 0) {
    p.vy = JUMP_V; p.y = -0.01; p.jumpBuffer = 0; beep(520, 0.09);
  }
  p.jumpBuffer = Math.max(0, p.jumpBuffer - dt);
  if (p.y < 0) {
    p.vy += (p.fastFall ? FAST_FALL : GRAVITY) * dt;
    p.y += p.vy * dt;
    if (p.y >= 0) { p.y = 0; p.vy = 0; p.fastFall = false; }
  }

  state.nextSpawn -= dt;
  if (state.nextSpawn <= 0) spawn();
  for (const o of state.obstacles) o.x -= (state.speed + (o.extra || 0)) * speedScale * dt;
  state.obstacles = state.obstacles.filter(o => o.x + o.w > -20);

  for (const c of state.clouds) { c.x -= state.speed * 0.12 * speedScale * dt; if (c.x < -70) { c.x = W + 30; c.y = 40 + Math.random() * H * 0.3; } }
  for (const s of state.specks) { s.x -= state.speed * speedScale * dt; if (s.x < 0) s.x += 800; }

  const box = playerBox();
  if (state.obstacles.some(o => hits(box, o))) {
    state.mode = "over"; state.t = 0; beep(140, 0.35, "sawtooth", 0.06);
    if (state.score > hi) { hi = Math.floor(state.score); store.set(hi); }
  }
}

function mix(a, b, t) {
  const pa = a.match(/\w\w/g).map(h => parseInt(h, 16)), pb = b.match(/\w\w/g).map(h => parseInt(h, 16));
  return `rgb(${pa.map((v, i) => Math.round(v + (pb[i] - v) * t)).join(",")})`;
}

function draw() {
  const n = state.night, ink = mix("#3b3442", "#e9e4ef", n);
  const res = +canvas.dataset.res || 1, touch = isTouch();
  ctx.setTransform(res, 0, 0, res, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = mix("#fbeedd", "#1f2340", n);
  ctx.fillRect(0, 0, W, H);

  if (n > 0.02) {
    ctx.globalAlpha = n; ctx.fillStyle = "#fff";
    for (const s of state.stars) ctx.fillRect(s.x, s.y, 2, 2);
    ctx.fillStyle = "#f3e9c6"; ctx.fillRect(W - 140, 56, 30, 30);
    ctx.fillStyle = mix("#fbeedd", "#1f2340", n); ctx.fillRect(W - 128, 52, 22, 28);
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = mix("#f0d9c0", "#3a3f63", n);
  for (const c of state.clouds) {
    ctx.fillRect(c.x, c.y, 60, 9); ctx.fillRect(c.x + 12, c.y - 9, 30, 9);
  }

  ctx.fillStyle = ink;
  ctx.fillRect(0, GROUND - 1, W, 3);
  for (const s of state.specks) ctx.fillRect(s.x, GROUND + s.y, 6, 2);

  for (const o of state.obstacles) {
    const img = o.kind === "bird" ? (Math.floor(state.dist / 60) % 2 ? SPR.bird1 : SPR.bird2) : SPR[o.kind];
    ctx.drawImage(img, Math.round(o.x), Math.round(o.y));
  }

  const p = state.player, grounded = p.y >= 0, step = Math.floor(state.dist / 45) % 2;
  let img;
  if (p.ducking && grounded) img = step ? SPR.duck1 : SPR.duck2;
  else if (!grounded || state.mode === "ready") img = SPR.run1;
  else img = step ? SPR.run1 : SPR.run2;
  ctx.drawImage(img, 50, Math.round(GROUND - img.height + p.y));

  ctx.fillStyle = ink;
  ctx.font = "bold 18px ui-monospace, Menlo, Consolas, monospace";
  ctx.textAlign = "right";
  const score = String(Math.floor(state.score)).padStart(5, "0");
  const blink = state.flash > 0 && Math.floor(state.flash * 8) % 2;
  ctx.fillText(`HI ${String(hi).padStart(5, "0")}  ${blink ? "     " : score}`, W - 20, 30);

  ctx.textAlign = "center";
  if (state.mode === "ready") {
    ctx.fillText(touch ? "TAP TO START" : "PRESS SPACE TO START", W / 2, GROUND - 110);
    ctx.font = "14px ui-monospace, Menlo, Consolas, monospace";
    ctx.fillText(touch ? "right side: jump · hold left side: duck" : "SPACE jump · DOWN duck · P pause · M sound · F full screen", W / 2, GROUND - 84);
  } else if (state.mode === "pause") {
    ctx.fillText(touch ? "PAUSED - TAP TO RESUME" : "PAUSED - PRESS SPACE", W / 2, GROUND - 110);
  } else if (state.mode === "over") {
    ctx.fillText("GAME OVER", W / 2, GROUND - 110);
    ctx.font = "14px ui-monospace, Menlo, Consolas, monospace";
    ctx.fillText(touch ? "tap to play again" : "press space to play again", W / 2, GROUND - 84);
  }
  if (touch) {
    const band = H - GROUND;
    ctx.font = "bold 16px ui-monospace, Menlo, Consolas, monospace";
    if (band > 100) {
      const top = GROUND + 44, h = band - 64, w = W / 2 - 30;
      ctx.lineWidth = 2; ctx.strokeStyle = ink;
      ctx.globalAlpha = 0.55;
      ctx.strokeRect(20, top, w, h);
      ctx.strokeRect(W / 2 + 10, top, w, h);
      ctx.globalAlpha = 1;
      ctx.fillText("DUCK", 20 + w / 2, top + h / 2 + 6);
      ctx.fillText("JUMP", W / 2 + 10 + w / 2, top + h / 2 + 6);
    } else {
      ctx.fillStyle = mix("#fbeedd", "#1f2340", n);
      ctx.fillRect(W / 4 - 30, H - 24, 60, 22);
      ctx.fillRect(W * 3 / 4 - 30, H - 24, 60, 22);
      ctx.fillStyle = ink;
      ctx.globalAlpha = 0.55;
      ctx.fillText("DUCK", W / 4, H - 8);
      ctx.fillText("JUMP", W * 3 / 4, H - 8);
      ctx.globalAlpha = 1;
    }
  } else if (!document.hasFocus()) {
    ctx.font = "bold 14px ui-monospace, Menlo, Consolas, monospace";
    ctx.fillText("CLICK HERE SO THE GAME CAN HEAR YOUR KEYBOARD", W / 2, GROUND - 58);
  }
}

fit();
reset("ready");
addEventListener("resize", fit);
window.focus();
let last = performance.now();
function frame(now) {
  update(Math.min(0.033, (now - last) / 1000));
  last = now;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
